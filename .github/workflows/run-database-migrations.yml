name: Run Database Migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
      - name: Push Migrations to Supabase
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"
